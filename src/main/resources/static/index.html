<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <title>La Tritoneta - Concesionarios y Automoción</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/style.css">
</head>
<body>

<section class="hero">
    <div class="hero-header">
        <h1 class="hero-title">LA <span class="red-text">TRITONETA</span></h1>
        <p class="hero-desc">
            Para Concesionarios de Autos, Anuncios Clasificados, Alquiler de Vehículos, Talleres y Venta de
            Motocicletas.</p>
    </div>

    <div class="cards-container">
        <a class="skew-card overlay-blue" href="/circuitos">
            <div class="card-title">CIRCUITOS</div>
        </a>
        <a class="skew-card overlay-red" href="/coches">
            <div class="card-title">COCHES</div>
        </a>
        <a class="skew-card overlay-dark " href="/mecanicos">
            <div class="card-title">MECANICOS</div>
        </a>
        <a class="skew-card overlay-cyan text-decoration-none text-white" href="/piezas">
            <div class="card-title">PIEZAS</div>
        </a>
    </div>
</section>

</body>
</html>
