<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>La Tritoneta - Publicar Vehículo</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        body { background-color: #0b0e14; color: #fff; padding: 50px 20px; display: flex; justify-content: center; }

        .form-container {
            background: #121722; width: 100%; max-width: 600px; padding: 40px; border-radius: 12px;
            border: 1px solid rgba(255,255,255,0.08); box-shadow: 0 10px 30px rgba(0,0,0,0.6);
        }
        .form-header { margin-bottom: 30px; }
        .form-header h2 { font-size: 1.5rem; text-transform: uppercase; font-weight: 800; }
        .form-header h2 span { color: #ff1d35; }
        .form-header p { color: #9ca3af; font-size: 0.85rem; margin-top: 5px; }

        .form-row { display: flex; gap: 15px; margin-bottom: 20px; }
        .form-group { flex: 1; display: flex; flex-direction: column; gap: 8px; }

        label { font-size: 0.8rem; font-weight: 600; text-transform: uppercase; color: #9ca3af; }
        input, select, textarea {
            background: #0b0e14; border: 1px solid #2a3241; border-radius: 6px; padding: 12px;
            color: #fff; font-size: 0.9rem; outline: none; transition: 0.3s;
        }
        input:focus, select:focus, textarea:focus { border-color: #1e56ff; box-shadow: 0 0 8px rgba(30, 86, 255, 0.4); }

        .btn-submit {
            width: 100%; background: #1e56ff; color: #fff; font-weight: bold; border: none; padding: 14px;
            border-radius: 6px; text-transform: uppercase; cursor: pointer; transition: 0.3s; font-size: 0.85rem;
            margin-top: 10px;
        }
        .btn-submit:hover { background: #003cd6; }
    </style>
</head>
<body>

<div class="form-container">
    <div class="form-header">
        <h2>PUBLICAR EN <span>LA TRITONETA</span></h2>
        <p>Introduce los datos de tu vehículo para agregarlo al catálogo.</p>
    </div>

    <form>
        <div class="form-group" style="margin-bottom: 20px;">
            <label>Título del Anuncio</label>
            <input type="text" placeholder="Ej. Audi R8 2023 V10 Performance" required>
        </div>

        <div class="form-row">
            <div class="form-group">
                <label>Categoría</label>
                <select>
                    <option>Concesionario</option>
                    <option>Alquiler</option>
                    <option>Clasificados</option>
                </select>
            </div>
            <div class="form-group">
                <label>Precio ($)</label>
                <input type="number" placeholder="25000" required>
            </div>
        </div>

        <div class="form-group" style="margin-bottom: 20px;">
            <label>Descripción del Vehículo</label>
            <textarea rows="4" placeholder="Detalles, equipamiento y estado del coche..."></textarea>
        </div>

        <button type="submit" class="btn-submit"><i class="fas fa-paper-plane"></i> ENVIAR ANUNCIO</button>
    </form>
</div>

</body>
</html>
