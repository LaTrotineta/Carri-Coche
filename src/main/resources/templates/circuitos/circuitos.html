<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>La Tritoneta - Catálogo de Vehículos</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="/style/stylecircuitos.css" rel="stylesheet">
</head>
<body>

<div class="header-nav">
    <div class="logo">LA <span>TRITONETA</span></div>
    <a href="/" style="color: #9ca3af; text-decoration: none; font-size: 0.85rem;"><i class="fas fa-home"></i>
        Inicio</a>
</div>

<div class="layout">
    <form class="filter-box" method="get">
        <div class="filter-title">
            <i class="fas fa-filter"> </i> Filtros
        </div>
        <div class="filter-group">
            <label>Marca</label>
            <select name="marca" onchange="this.form.submit()">
                <option value="" th:selected="${marca == null && marca == ''}">Todos</option>
                <option th:each="coche : ${listaCoche}" th:value="${coche.marca}" th:text="${coche.marca}" th:selected="${marca != null && marca == coche.marca}"></option>
            </select>
        </div>
    </form>

    <main class="grid-container">
        <a class="circuitos-card" th:each="circuito : ${circuitos}">
            <div class="circuitos-img">
                <!--                    <i class="fas fa-car fa-3x" style="color: #374151;"></i>-->
                <img alt="imagenCircuito" src="">
                <span class="badge-tag" th:text="${circuito.pais}"></span>
            </div>
            <div class="circuitos-details">
                <div class="circuitos-matricula" th:text="'#' + ${circuito.id_circuito}"></div>
                <div class="circuitos-marca" th:text="${circuito.nombre}"></div>
                <div class="car-info">
                    <span th:text="'Curvas: ' + ${circuito.curvas} + ' |'"><i
                            class="fas fa-tachometer-alt"></i> </span>
                    <span th:text="'Longitud: ' + ${circuito.longitud}"><i class="fas fa-cog"></i> </span>
                </div>
            </div>
        </a>
    </main>
</div>

</body>
</html>
