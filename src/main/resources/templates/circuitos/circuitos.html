<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Catálogo de Circuitos (en memoria)</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container mt-5">
  <div class="d-flex justify-content-between align-items-center mb-4">
    <h1 class="text-primary fw-bold">🏎️ Catálogo de circuitos en memoria</h1>
    <a href="/circuitos/nuevo" class="btn btn-primary">Añadir nuevo circuito</a>
  </div>

  <div th:if="${circuitos.size() > 0}" class="table-responsive">
    <table class="table table-striped table-hover align-middle shadow-sm bg-white rounded">
      <thead class="table-primary">
      <tr>
        <th>ID</th>
        <th>Nombre</th>
        <th>País</th>
        <th>Curvas</th>
        <th>Longitud</th>
        <th class="text-center">Acciones</th>
      </tr>
      </thead>
      <tbody>
      <tr th:each="circuito : ${circuitos}">
        <td th:text="${circuito.id_circuito}">1</td>
        <td th:text="${circuito.nombre}">Monza</td>
        <td th:text="${circuito.pais}">Italia</td>
        <td th:text="${circuito.curvas}">11</td>
        <td th:text="${circuito.longitud}">5.793</td>
        <td class="text-center">
          <a th:href="@{/circuito/{id}(id=${circuito.id_circuito})}" class="btn btn-info btn-sm">Detalles</a>
          <a th:href="@{/circuitos/editar/{id}(id=${circuito.id_circuito})}" class="btn btn-warning btn-sm">Editar</a>
          <a th:href="@{/circuitos/borrar/{id}(id=${circuito.id_circuito})}" class="btn btn-danger btn-sm"
             onclick="return confirm('¿Estás seguro de borrar este circuito?')">Borrar</a>
        </td>
      </tr>
      </tbody>
    </table>
  </div>

  <div th:unless="${circuitos.size() > 0}" class="alert alert-warning text-center shadow-sm">
    No se han encontrado circuitos registrados en el sistema.
  </div>

  <div class="text-start mt-4">
    <a href="/" class="btn btn-outline-secondary">Volver al inicio</a>
  </div>
</div>
</body>
</html>
