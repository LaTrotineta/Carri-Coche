<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>La Tritoneta - Detalle del Vehículo</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/style/detalleCoche.css">
</head>
<body>

<header class="header-nav">
    <a href="/" class="logo">LA <span class="red-text">TRITONETA</span></a>
    <!--    <a href="/coches" class="btn-link"><i class="fas fa-arrow-left"></i> Volver</a>-->
</header>
<main class="detail-card" th:object="${coche}">
    <h2 class="detail-title">DETALLE DEL COCHE</h2>
    <p class="detail-subtitle">Especificaciones técnicas del sistema de La Tritoneta.</p>

    <div class="info-group" style="margin-bottom: 20px;">
        <span class="info-label"><i class="fas fa-id-card"></i> Matrícula</span>
        <div class="info-value" th:text="${matricula}"/>
    </div>

    <div class="info-row">
        <div class="info-group">
            <span class="info-label"><i class="fas fa-industry"></i> Marca</span>
            <span class="info-value" th:text="*{marca}"/>
        </div>
        <div class="info-group">
            <span class="info-label"><i class="fas fa-car-side"></i> Modelo</span>
            <div class="info-value" th:text="*{modelo}"/>
        </div>
    </div>

    <div class="info-row">
        <div class="info-group">
            <span class="info-label"><i class="fas fa-bolt"></i> Potencia</span>
            <div class="info-value" th:text="*{potencia}"/>
        </div>
        <div class="info-group">
            <span class="info-label"><i class="fas fa-gas-pump"></i> Consumo</span>
            <div class="info-value" th:text="*{consumo}"/>
        </div>
    </div>

    <div class="card-actions">
        <a class="btn btn-outline" href="/coches"><i class="fas fa-arrow-left"></i> Volver</a>
        <a class="btn btn-red" th:href="'/coche/editar/' + ${coche.matricula}"><i class="fas fa-save"></i>Editar</a>
    </div>
</main>
</body>
</html>
