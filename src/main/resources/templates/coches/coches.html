<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>La Tritoneta - Catálogo de Vehículos</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="/style/coches.css" rel="stylesheet">
</head>
<body>

<div class="header-nav">
    <a class="logo" href="/">LA <span>TRITONETA</span></a>
    <a class="inicio" href="/" style=""><i class="fas fa-home"></i>
        Inicio</a>
</div>

<div class="layout">
    <form class="filter-box" method="get">
        <div class="filter-title">
            <i class="fas fa-filter"> </i> Filtros
        </div>
        <div class="filter-group">
<!--            <label>Buscar</label>-->
<!--            <label>-->
<!--                <input name="buscar" onchange="this.form.submit()">-->
<!--            </label>-->
            <label>Marca</label>
            <label>
                <select name="marca" onchange="this.form.submit()">
                    <option value="" th:selected="${marca == null && marca == ''}">Todos</option>
                    <option th:each="coche : ${listaCoches}" th:value="${coche.marca}" th:text="${coche.marca}" th:selected="${marca != null && marca == coche.marca}"></option>
                </select>
            </label>
        </div>
    </form>

    <main class="grid-container">

        <a class="card new" th:href="@{/coche/nuevo}">
            <i class="fas fa-plus fa-3x"></i>
        </a>

        <a class="card" th:each="coche : ${coches}" th:href="'/coche/' + ${coche.matricula}">
            <div class="img">
                <!--<i class="fas fa-car fa-3x" style="color: #374151;"></i>-->
                <img alt="imagenCoche" src="">
                <span class="badge-tag" th:text="${coche.marca}"></span>
            </div>
            <div class="details">
                <div class="main-text" th:text="'Matricula: ' + ${coche.matricula}"></div>
                <div class="secundary-text" th:text="'Modelo: ' + ${coche.modelo}"></div>
                <div class="info">
                    <span th:utext="'<i class=\'fas fa-tachometer-alt\'></i> Potencia: ' + ${coche.potencia}"></span>
                    <span th:utext="'<i class=\'fas fa-cog\'></i> Consumo: ' + ${coche.consumo}"></span>
                </div>
            </div>
        </a>
    </main>
</div>

</body>
</html>
