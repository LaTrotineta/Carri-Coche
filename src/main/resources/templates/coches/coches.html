<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>La Tritoneta - Catálogo de Vehículos</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="/style/stylecoches.css" rel="stylesheet">
</head>
<body>

<div class="header-nav">
    <div class="logo">LA <span>TRITONETA</span></div>
    <a href="/" style="color: #9ca3af; text-decoration: none; font-size: 0.85rem;"><i class="fas fa-home"></i>
        Inicio</a>
</div>

<div class="layout">
    <aside class="filter-box">
        <div class="filter-title"><i class="fas fa-filter"></i> Filtros</div>
        <div class="filter-group">
            <label>Marca</label>
            <select>
                <option>Todas</option>
                <option>Audi</option>
                <option>BMW</option>
            </select>
        </div>
        <div class="filter-group">
            <label>Tipo</label>
            <select>
                <option>Nuevos</option>
                <option>Alquiler</option>
            </select>
        </div>
    </aside>

    <main class="grid-container">
        <div th:each="coche : ${coches}">
            <div class="coche-card">
                <div class="coche-img">
                    <!--                    <i class="fas fa-car fa-3x" style="color: #374151;"></i>-->
                    <img alt="imagenCoche" src="">
                    <span class="badge-tag" th:text="${coche.marca}"></span>
                </div>
                <div class="coche-details">
                    <div class="coche-matricula" th:text="${coche.modelo}"></div>
                    <div class="coche-marca" th:text="${coche.matricula}"></div>
                    <div class="car-info">
                        <span th:text="'Potencia: ' + ${coche.potencia} + ' |'"><i
                                class="fas fa-tachometer-alt"></i> </span>
                        <span th:text="'Consumo: ' + ${coche.consumo}"><i class="fas fa-cog"></i> </span>
                    </div>
                </div>
            </div>
        </div>
    </main>
</div>

</body>
</html>
