<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>La Tritoneta - Catálogo de Vehículos</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        body { background-color: #0b0e14; color: #fff; padding: 40px; }

        .header-nav { display: flex; justify-content: space-between; align-items: center; margin-bottom: 40px; }
        .logo { font-size: 1.5rem; font-weight: 900; text-transform: uppercase; }
        .logo span { color: #ff1d35; }

        .layout { display: grid; grid-template-columns: 250px 1fr; gap: 30px; }

        /* Filter sidebar */
        .filter-box { background: #121722; padding: 20px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.05); }
        .filter-title { font-weight: bold; margin-bottom: 15px; font-size: 0.9rem; text-transform: uppercase; color: #ff1d35; }
        .filter-group { margin-bottom: 15px; }
        .filter-group label { display: block; font-size: 0.8rem; color: #9ca3af; margin-bottom: 5px; }
        .filter-group select, .filter-group input {
            width: 100%; padding: 8px; background: #0b0e14; border: 1px solid #2a3241; color: #fff; border-radius: 4px;
        }

        /* Grid Cars */
        .grid-container { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 20px; }
        .car-card { background: #121722; border-radius: 8px; overflow: hidden; border: 1px solid rgba(255,255,255,0.05); transition: 0.3s; }
        .car-card:hover { border-color: #1e56ff; transform: translateY(-5px); }

        .car-img { height: 160px; background: #1f2937; position: relative; display: flex; align-items: center; justify-content: center; }
        .badge-tag { position: absolute; top: 10px; left: 10px; background: #ff1d35; font-size: 0.65rem; font-weight: bold; padding: 3px 8px; border-radius: 3px; }

        .car-details { padding: 15px; }
        .car-name { font-size: 1rem; font-weight: bold; margin-bottom: 8px; }
        .car-price { color: #1e56ff; font-weight: 800; font-size: 1.1rem; margin-bottom: 12px; }
        .car-info { font-size: 0.75rem; color: #9ca3af; display: flex; justify-content: space-between; border-top: 1px solid #1f2937; padding-top: 10px; }
    </style>
</head>
<body>

<div class="header-nav">
    <div class="logo">LA <span>TRITONETA</span></div>
    <a href="index.html" style="color: #9ca3af; text-decoration: none; font-size: 0.85rem;"><i class="fas fa-home"></i> Inicio</a>
</div>

<div class="layout">
    <aside class="filter-box">
        <div class="filter-title"><i class="fas fa-filter"></i> Filtros</div>
        <div class="filter-group">
            <label>Marca</label>
            <select><option>Todas</option><option>Audi</option><option>BMW</option></select>
        </div>
        <div class="filter-group">
            <label>Tipo</label>
            <select><option>Nuevos</option><option>Alquiler</option></select>
        </div>
    </aside>

    <main class="grid-container">
        <!-- Item 1 -->
        <div class="car-card">
            <div class="car-img">
                <i class="fas fa-car fa-3x" style="color: #374151;"></i>
                <span class="badge-tag">OFERTA</span>
            </div>
            <div class="car-details">
                <div class="car-name">Deportivo Triton V8</div>
                <div class="car-price">$45,000</div>
                <div class="car-info">
                    <span><i class="fas fa-tachometer-alt"></i> 12,000 km</span>
                    <span><i class="fas fa-cog"></i> Automático</span>
                </div>
            </div>
        </div>

        <!-- Item 2 -->
        <div class="car-card">
            <div class="car-img">
                <i class="fas fa-car fa-3x" style="color: #374151;"></i>
                <span class="badge-tag" style="background: #1e56ff;">ALQUILER</span>
            </div>
            <div class="car-details">
                <div class="car-name">SUV Triton Family</div>
                <div class="car-price">$120 / día</div>
                <div class="car-info">
                    <span><i class="fas fa-tachometer-alt"></i> 5,000 km</span>
                    <span><i class="fas fa-cog"></i> Manual</span>
                </div>
            </div>
        </div>
    </main>
</div>

</body>
</html>
