<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>La Tritoneta - Detalle del Vehículo</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/style/detalles/detalleCoche.css">
</head>
<body>

<header class="header-nav">
    <a href="/" class="logo">LA <span class="red-text">TRITONETA</span></a>
<!--        <a href="/coches" class="btn-link"><i class="fas fa-arrow-left"></i> Volver</a>-->
</header>
<form class="detail-card" th:action="@{/mecanico/guardar}" th:object="${mecanico}" method="post">
    <h2 class="detail-title" th:text="${titulo}"></h2>
    <p class="detail-subtitle">Especificaciones técnicas del sistema de La Tritoneta.</p>

    <div class="info-group">
        <th:block th:if="${titulo == 'Nuevo Mecanico'}">
            <label for="nuevaId" class="info-label"><i class="fas fa-id-card"></i> Id</label>
            <input  type="number" id="nuevaId" th:field="*{id_mecanico}" class="info-value" readonly />
        </th:block>
        <th:block th:unless="${titulo == 'Nuevo Mecanico'}">
            <label for="id" class="info-label"><i class="fas fa-id-card"></i> Id</label>
            <input type="text" id="id" th:field="*{id_mecanico}" class="info-value" readonly />
        </th:block>
    </div>

    <div class="info-row">
        <div class="info-group">
            <label for="nombre" class="info-label"><i class="fas fa-industry"></i> Nombre</label>
            <input type="text" id="nombre" th:field="*{nombre}" class="info-value" required />
        </div>
        <div class="info-group">
            <label for="especialidad" class="info-label"><i class="fas fa-car-side"></i> Especialidad</label>
            <input type="text" id="especialidad" th:field="*{especialidad}" class="info-value" required />
        </div>
    </div>

    <div class="info-row">
        <div class="info-group">
            <label for="experiencia" class="info-label"><i class="fas fa-bolt"></i> Experiencia</label>
            <input type="number" pattern="\d*" step="any" id="experiencia" th:field="*{experiencia}" class="info-value" required />
        </div>
        <div class="info-group">
            <label for="tarifaHora" class="info-label"><i class="fas fa-gas-pump"></i> Tarifa Hora</label>
            <input type="number" step="any" id="tarifaHora" th:field="*{tarifaHora}" class="info-value" required />
        </div>
    </div>

<!--    <div class="info-group">-->
<!--        <label>Archivo adjunto:</label>-->
<!--        <input type="file" name="archivoAdjunto" />-->
<!--    </div>-->

    <div class="card-actions">
        <a class="btn btn-outline" href="/mecanicos" th:if="${titulo == 'Nuevo Mecanico'}"><i class="fas fa-arrow-left"></i> Volver</a>
        <a class="btn btn-outline" th:href="'/mecanico/' + ${mecanico.id_mecanico}" th:unless="${titulo == 'Nuevo Mecanico'}"><i class="fas fa-arrow-left"></i> Volver</a>
        <button type="submit" class="btn btn-red"><i class="fas fa-save"></i> Guardar</button>
    </div>
</form>
</body>
</html>
