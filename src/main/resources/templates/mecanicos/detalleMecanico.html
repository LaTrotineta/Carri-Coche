<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>La Tritoneta - Detalle del Vehículo</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/style/detalles/detalleCoche.css">
</head>
<body>

<header class="header-nav">
    <a href="/" class="logo">LA <span class="red-text">TRITONETA</span></a>
    <a href="/mecanicos" class="btn-link"><i class="fas fa-arrow-left"></i> Volver</a>
</header>
<main class="detail-card" th:object="${mecanico}">
    <h2 class="detail-title">DETALLE DEL MECANICO</h2>
    <p class="detail-subtitle">Especificaciones técnicas del sistema de La Tritoneta.</p>

    <div class="info-group">
        <span class="info-label"><i class="fas fa-id-card"></i> ID</span>
        <div class="info-value" th:text="${id_mecanico}"/>
    </div>

    <div class="info-row">
        <div class="info-group">
            <span class="info-label"><i class="fas fa-industry"></i> Nombre</span>
            <div class="info-value" th:text="*{nombre}"/>
        </div>
        <div class="info-group">
            <span class="info-label"><i class="fas fa-car-side"></i> Especialidad</span>
            <div class="info-value" th:text="*{especialidad}"/>
        </div>
    </div>

    <div class="info-row">
        <div class="info-group">
            <span class="info-label"><i class="fas fa-bolt"></i> Experiencia</span>
            <div class="info-value" th:text="*{experiencia}"/>
        </div>
        <div class="info-group">
            <span class="info-label"><i class="fas fa-gas-pump"></i> Tarifa Hora</span>
            <div class="info-value" th:text="*{tarifaHora}"/>
        </div>
    </div>

    <div class="card-actions">
        <a class="btn btn-outline" href="/mecanicos"><i class="fas fa-arrow-left"></i> Volver</a>

        <a class="btn btn-red" onclick="return confirm('¿Estás seguro de que deseas borrar este mecanico?\nEsta acción no se puede deshacer.');" th:href="'/mecanico/borrar/' + ${mecanico.id_mecanico}"><i class="fas fa-trash"></i> Borrar</a>
        <a class="btn btn-red" th:href="'/mecanico/editar/' + ${mecanico.id_mecanico}"><i class="fas fa-save"></i>Editar</a>
    </div>
</main>
</body>
</html>
