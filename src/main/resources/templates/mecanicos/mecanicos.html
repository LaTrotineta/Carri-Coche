<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>La Tritoneta - Catálogo de Vehículos</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="/style/mecanicos.css" rel="stylesheet">
</head>
<body>

<div class="header-nav">
    <div class="logo">LA <span>TRITONETA</span></div>
    <a href="/" style="color: #9ca3af; text-decoration: none; font-size: 0.85rem;"><i class="fas fa-home"></i>
        Inicio</a>
</div>

<div class="layout">
    <form class="filter-box" method="get">
        <div class="filter-title">
            <i class="fas fa-filter"> </i> Filtros
        </div>
        <div class="filter-group">
            <label>Marca</label>
            <select name="marca" onchange="this.form.submit()">
                <option th:selected="${marca == null && marca == ''}" value="">Todos</option>
                <option th:each="coche : ${listaCoche}" th:selected="${marca != null && marca == coche.marca}" th:text="${coche.marca}"
                        th:value="${coche.marca}"></option>
            </select>
        </div>
    </form>

    <main class="grid-container">
        <a class="card" th:each="mecanico : ${mecanicos}">
            <div class="img">
                <!--                    <i class="fas fa-car fa-3x" style="color: #374151;"></i>-->
                <img alt="imagenCircuito" src="">
                <span class="badge-tag" th:text="${mecanico.especialidad}"></span>
            </div>
            <div class="details">
                <div class="main-text" th:text="'#' + ${mecanico.id_mecanico}"></div>
                <div class="secundary-text" th:text="'' + ${mecanico.nombre}"></div>
                <div class="info">
                    <span th:text="'Experiencia: ' + ${mecanico.experiencia} + ' |'"><i
                            class="fas fa-tachometer-alt"></i> </span>
                    <span th:text="'Tarifa: ' + ${mecanico.tarifaHora} + '€/H'"><i class="fas fa-cog"></i> </span>
                </div>
            </div>
        </a>
    </main>
</div>

</body>
</html>
