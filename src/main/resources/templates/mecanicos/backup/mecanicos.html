<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Catálogo de Mecanicos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container mt-5">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h1 class="text-success fw-bold">👨‍🔧 Catálogo de Mecanicos</h1>
        <a href="/mecanicos/nuevo" class="btn btn-success">Añadir un nuevo mecanico</a>
    </div>

    <div th:if="${mecanicos.size() > 0}" class="table-responsive">
        <table class="table table-striped table-hover align-middle shadow-sm bg-white rounded">
            <thead class="table-success">
            <tr>
                <th>ID</th>
                <th>Nombre</th>
                <th>Especialidad</th>
                <th>Experiencia</th>
                <th>Tarifa Hora</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="mecanico : ${mecanicos}">
                <td th:text="${mecanico.id_mecanico}">1</td>
                <td th:text="${mecanico.nombre}">Mecanico</td>
                <td th:text="${mecanico.especialidad}">Mecanica</td>
                <td th:text="${mecanico.experiencia}">Experiencia</td>
                <td th:text="${mecanico.tarifaHora}">Tarifa</td>
                <td class="text-center">
                    <a th:href="@{/mecanico/{id}(id=${mecanico.id_mecanico})}" class="btn btn-info btn-sm">Detalles</a>
                    <a th:href="@{/mecanicos/editar/{id}(id=${mecanico.id_mecanico})}" class="btn btn-warning btn-sm">Editar</a>
                    <a th:href="@{/mecanicos/borrar/{id}(id=${mecanico.id_mecanico})}" class="btn btn-danger btn-sm"
                       onclick="return confirm('¿Estás seguro de borrar este mecanico?')">Borrar</a>
                </td>
            </tr>
            </tbody>
        </table>
    </div>

    <div th:unless="${mecanicos.size() > 0}" class="alert alert-warning text-center shadow-sm">
        No se han encontrado mecanicos registrados en el sistema.
    </div>

    <div class="text-start mt-4">
        <a href="/static" class="btn btn-outline-secondary">Volver al inicio</a>
    </div>
</div>
</body>
</html>
