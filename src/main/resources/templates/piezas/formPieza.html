<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>La Tritoneta - Detalle del Vehículo</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/style/detalles/detalleCoche.css">
</head>
<body>

<header class="header-nav">
    <a href="/" class="logo">LA <span class="red-text">TRITONETA</span></a>
    <!--    <a href="/coches" class="btn-link"><i class="fas fa-arrow-left"></i> Volver</a>-->
</header>
<form class="detail-card" th:action="@{/pieza/guardar}" th:object="${pieza}" method="post">
    <h2 class="detail-title" th:text="${titulo}"></h2>
    <p class="detail-subtitle">Especificaciones técnicas del sistema de La Tritoneta.</p>
    <div class="info-group" style="margin-bottom: 20px;">
        <label for="id_pieza" class="info-label"><i class="fas fa-id-card"></i> ID</label>
        <input type="text" id="id_pieza" th:field="*{id_pieza}" class="info-value" readonly />
    </div>

    <div class="info-row">
        <div class="info-group">
            <label for="nombre" class="info-label"><i class="fas fa-industry"></i> Nombre</label>
            <input type="text" id="nombre" style="text-transform: uppercase;" th:field="*{nombre}" class="info-value" required />
        </div>
        <div class="info-group">
            <label for="fabricante" class="info-label"><i class="fas fa-car-side"></i> Fabricante</label>
            <input type="text" id="fabricante" style="text-transform: uppercase;" th:field="*{fabricante}" class="info-value" required />
        </div>
    </div>

    <div class="info-row">
        <div class="info-group">
            <label for="stock" class="info-label"><i class="fas fa-bolt"></i> Stock</label>
            <input type="number" pattern="\d*" min="0" oninput="if(this.value < 0) this.value = 0;"
                   onkeydown="if(event.key==='-') event.preventDefault();" step="1" id="stock" th:field="*{stock}" class="info-value" required />
        </div>
        <div class="info-group">
            <label for="precio" class="info-label"><i class="fas fa-gas-pump"></i> Precio</label>
            <input type="number" step="any" min="0" oninput="if(this.value < 0) this.value = 0;"
                   onkeydown="if(event.key==='-') event.preventDefault();" id="precio" th:field="*{precio}" class="info-value" required />
        </div>
    </div>

<!--    <div class="info-group">-->
<!--        <label>Archivo adjunto:</label>-->
<!--        <input type="file" name="archivoAdjunto" />-->
<!--    </div>-->

    <div class="card-actions">
        <a class="btn btn-outline" href="/piezas" th:if="${titulo == 'Nueva Pieza'}"><i class="fas fa-arrow-left"></i> Volver</a>
        <a class="btn btn-outline" th:href="'/pieza/' + ${pieza.id_pieza}" th:unless="${titulo == 'Nueva Pieza'}"><i class="fas fa-arrow-left"></i> Volver</a>
        <button type="submit" class="btn btn-red"><i class="fas fa-save"></i> Guardar</button>
    </div>
</form>
</body>
</html>
