<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>La Tritoneta - Detalle del Vehículo</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/style/detalles/detalleCoche.css">
</head>
<body>

<header class="header-nav">
    <a href="/" class="logo">LA <span class="red-text">TRITONETA</span></a>
    <!--    <a href="/coches" class="btn-link"><i class="fas fa-arrow-left"></i> Volver</a>-->
</header>
<form class="detail-card" th:action="@{/piezas/guardar}" th:object="${pieza}" method="post">
    <h2 class="detail-title" th:text="${titulo}"></h2>
    <p class="detail-subtitle">Especificaciones técnicas del sistema de La Tritoneta.</p>
    <div class="info-group" style="margin-bottom: 20px;">
        <input type="hidden" th:field="*{id_pieza}">
        <th:block th:if="${titulo == 'Nueva Pieza'}">
            <label for="nuevaMatricula" class="info-label"><i class="fas fa-id-card"></i> Nombre</label>
            <input  type="text" id="nuevaMatricula"th:field="*{nombre}" class="info-value" required />
        </th:block>
        <th:block th:unless="${titulo == 'Nueva Pieza'}">
            <label for="matricula" class="info-label"><i class="fas fa-id-card"></i> Nombre</label>
            <input th:unless="${titulo == 'Nueva Pieza'}" type="text" id="matricula" th:field="*{nombre}" class="info-value" readonly />
        </th:block>
    </div>

    <div class="info-row">
        <div class="info-group">
            <label for="marca" class="info-label"><i class="fas fa-industry"></i> Fabricante</label>
            <input type="text" id="marca" th:field="*{fabricante}" class="info-value" required />
        </div>
        <div class="info-group">
            <label for="modelo" class="info-label"><i class="fas fa-car-side"></i> Precio</label>
            <input type="text" id="modelo" th:field="*{precio}" class="info-value" required />
        </div>
    </div>

    <div class="info-row">
        <div class="info-group">
            <label for="potencia" class="info-label"><i class="fas fa-bolt"></i> Stock</label>
            <input type="number" step="any" id="potencia" th:field="*{stock}" class="info-value" required />
        </div>
    </div>

    <div class="card-actions">
        <a class="btn btn-outline" href="/piezas" th:if="${titulo == 'Nueva Pieza'}"><i class="fas fa-arrow-left"></i> Volver</a>
        <a class="btn btn-outline" th:href="'/pieza/' + ${pieza.id_pieza}" th:unless="${titulo == 'Nueva Pieza'}"><i class="fas fa-arrow-left"></i> Volver</a>
        <button type="submit" class="btn btn-red"><i class="fas fa-save"></i> Guardar</button>
    </div>
</form>
</body>
</html>
