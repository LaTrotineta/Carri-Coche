<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Detalles de la pieza</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container mt-5" style="max-width: 500px;">
    <div class="card shadow-sm border-0 text-center">

<!--        <img th:src="@{/fotos/{nombreImagen}(nombreImagen=${pieza.foto})}"-->
<!--             alt="Foto"-->
<!--             class="img-fluid rounded mb-4"-->
<!--             style="max-height: 250px;">-->

        <div class="card-body p-4">
            <h1 class="text-success fw-bold mb-3" th:text="${pieza.nombre}">Nombre</h1>
            <p class="text-muted fs-5">
                <strong>Fabricante:</strong> <span th:text="${pieza.fabricante}">Flor</span> <br>
                <strong>Stock:</strong> <span th:text="${pieza.stock}">1.2</span> metros
            </p>
            <hr>
            <div class="d-flex justify-content-around mt-4">
                <a href="/piezas" class="btn btn-outline-secondary">Volver al listado</a>
                <a th:href="@{/piezas/editar/{id}(id=${pieza.id_pieza})}" class="btn btn-warning">Editar</a>
            </div>
        </div>
    </div>
</div>
</body>
</html>
