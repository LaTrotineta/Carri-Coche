<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>La Tritoneta - Detalle de la pieza</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/style/detalles/detalleCoche.css">
</head>
<body>

<header class="header-nav">
    <a href="/" class="logo">LA <span class="red-text">TRITONETA</span></a>
<!--    <a href="/piezas" class="btn-link"><i class="fas fa-arrow-left"></i> Volver</a>-->
</header>
<main class="detail-card" th:object="${pieza}">
    <h2 class="detail-title">DETALLE DEL PIEZA</h2>
    <p class="detail-subtitle">Especificaciones técnicas del sistema de La Tritoneta.</p>

    <div class="info-group">
        <span class="info-label"><i class="fas fa-id-card"></i> ID</span>
        <div class="info-value" th:text="${id_pieza}"/>
    </div>

    <div class="info-row">
        <div class="info-group">
            <span class="info-label"><i class="fas fa-industry"></i> Nombre</span>
            <div class="info-value" th:text="*{nombre}"/>
        </div>
        <div class="info-group">
            <span class="info-label"><i class="fas fa-car-side"></i> Fabricante</span>
            <div class="info-value" th:text="*{fabricante}"/>
        </div>
    </div>

    <div class="info-row">
        <div class="info-group">
            <span class="info-label"><i class="fas fa-bolt"></i> Stock</span>
            <div class="info-value" th:text="*{stock}"/>
        </div>
        <div class="info-group">
            <span class="info-label"><i class="fas fa-gas-pump"></i> Precio</span>
            <div class="info-value" th:text="*{precio}"/>
        </div>

    </div>

    <div class="card-actions">
        <a class="btn btn-outline" href="/piezas"><i class="fas fa-arrow-left"></i> Volver</a>

        <a class="btn btn-red" th:href="'/pieza/borrar/' + ${pieza.id_pieza}"><i class="fas fa-trash"></i> Borrar</a>
        <a class="btn btn-red" th:href="'/pieza/editar/' + ${pieza.id_pieza}"><i class="fas fa-save"></i>Editar</a>
    </div>
</main>
</body>
</html>
